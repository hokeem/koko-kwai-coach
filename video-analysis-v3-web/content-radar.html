<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ff5f18">
  <title>Koko TikTok 选片</title>
  <style>
    :root{--orange:#ff5f18;--orange-dark:#e94b08;--orange-soft:#fff0e8;--ink:#241d19;--muted:#7f746d;--line:#eadfd8;--paper:#fffaf7;--card:#fff;--red:#b84234;--shadow:0 16px 40px rgba(92,47,22,.10)}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;min-height:100vh;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:linear-gradient(180deg,#fff1e7 0,#fffaf7 260px)}button{font:inherit;cursor:pointer}a{color:inherit}
    .header{position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(255,95,24,.13);background:rgba(255,250,247,.9);backdrop-filter:blur(18px)}
    .header-inner,.page{width:min(1240px,calc(100% - 32px));margin:auto}.header-inner{height:70px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:92px}.brand-line{width:1px;height:26px;background:var(--line)}.brand-copy b{display:block;font-size:15px}.brand-copy span{display:block;margin-top:2px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .fetch{min-height:42px;border:0;border-radius:13px;padding:0 18px;background:linear-gradient(135deg,#ff792e,var(--orange));color:#fff;font-weight:850;box-shadow:0 9px 24px rgba(255,95,24,.24);transition:.18s}.fetch:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,95,24,.3)}.fetch:disabled{opacity:.58;cursor:wait;transform:none}
    .page{padding:34px 0 54px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}.eyebrow{margin:0 0 8px;color:var(--orange-dark);font-size:11px;font-weight:900;letter-spacing:.12em}.intro h1{font-size:clamp(30px,4vw,46px);line-height:1.08;margin:0 0 10px;letter-spacing:-.04em}.intro p{margin:0;color:var(--muted);font-size:14px}.last-run{max-width:380px;text-align:right;color:var(--muted);font-size:11px;line-height:1.6}.last-run b{color:var(--ink)}
    .bar{position:sticky;top:70px;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;background:rgba(255,250,247,.92);backdrop-filter:blur(14px)}.tabs{display:flex;gap:5px;padding:4px;border:1px solid var(--line);border-radius:14px;background:#fff}.tab{height:36px;border:0;border-radius:10px;padding:0 14px;background:transparent;color:var(--muted);font-size:12px;font-weight:850}.tab.active{background:var(--orange-soft);color:var(--orange-dark)}.tab span{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;border-radius:999px;background:rgba(0,0,0,.055);font-size:10px}.queue-copy{font-size:12px;color:var(--muted)}.queue-copy b{color:var(--ink)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 6px 22px rgba(72,42,24,.055);transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#e8c9b8}.player-shell{position:relative;aspect-ratio:9/13;background:linear-gradient(150deg,#2d241f,#6b4b38);overflow:hidden}.player-shell iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#17110e}.player-placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 36%,rgba(255,118,47,.42),transparent 28%),linear-gradient(150deg,#2d241f,#5b3b2b)}.player-placeholder div{display:grid;justify-items:center;gap:10px}.player-placeholder .play{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;padding-left:4px;background:var(--orange);border:2px solid rgba(255,255,255,.9);box-shadow:0 10px 28px rgba(0,0,0,.28);font-size:20px}.player-placeholder b{font-size:13px}.player-placeholder span{color:rgba(255,255,255,.72);font-size:10px}.views{position:absolute;z-index:2;left:10px;top:10px;padding:6px 9px;border-radius:999px;color:#fff;background:rgba(29,20,16,.72);backdrop-filter:blur(8px);font-size:10px;font-weight:850;pointer-events:none}.body{padding:14px}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px}.author{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--orange-dark);font-weight:850}.caption{min-height:43px;margin:8px 0 13px;font-size:13px;font-weight:750;line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}.choice{height:39px;border-radius:11px;font-weight:900}.choice.no{border:1px solid var(--line);background:#fff;color:var(--muted)}.choice.no:hover{border-color:#d9aaa2;color:var(--red);background:#fff7f5}.choice.yes{border:1px solid var(--orange);background:var(--orange);color:#fff}.choice.yes:hover{background:var(--orange-dark)}
    .empty{grid-column:1/-1;padding:90px 24px;text-align:center;border:1px dashed #e6c5b2;border-radius:20px;background:rgba(255,255,255,.58);color:var(--muted)}.empty strong{display:block;margin-bottom:8px;color:var(--ink);font-size:21px}.empty .fetch{margin-top:16px}.loading{display:inline-block;width:14px;height:14px;margin-right:7px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;right:22px;bottom:22px;z-index:50;max-width:min(420px,calc(100% - 44px));padding:12px 16px;border-radius:12px;background:#2d241f;color:#fff;box-shadow:var(--shadow);font-size:12px;font-weight:750;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    .login{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(56,31,18,.55);backdrop-filter:blur(14px)}.login.show{display:grid}.login-box{width:min(420px,100%);padding:28px;border:1px solid rgba(255,95,24,.2);border-radius:24px;background:#fffaf7;box-shadow:0 30px 90px rgba(70,31,10,.28)}.login-logo{width:110px}.login-box h2{margin:18px 0 6px;font-size:26px}.login-box p{margin:0 0 14px;color:var(--muted);font-size:12px}.login-box input{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.login-box input:focus{border-color:var(--orange)}.login-box .fetch{width:100%;margin-top:10px}.login-error{min-height:20px;padding-top:5px;color:var(--red);font-size:11px}
    @media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.header-inner,.page{width:min(100% - 22px,1240px)}.brand-line,.brand-copy span{display:none}.intro{display:block;margin-bottom:14px}.last-run{margin-top:12px;text-align:left}.bar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:11px}.caption{font-size:12px}.tabs{width:100%}.tab{flex:1;padding:0 8px}}@media(max-width:430px){.brand img{width:78px}.fetch{padding:0 13px}.header .fetch{font-size:12px}.grid{grid-template-columns:1fr 1fr}.cover{aspect-ratio:9/12}.actions{grid-template-columns:1fr}.choice{height:36px}.open-copy{display:none}}
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><div class="brand"><img src="/brand/kwai-wordmark.svg" alt="Kwai"><span class="brand-line"></span><div class="brand-copy"><b>Koko TikTok 选片</b><span>Content Radar</span></div></div><button id="fetch" class="fetch">抓取今日视频</button></div></header>
  <main class="page">
    <section class="intro"><div><div class="eyebrow">TIKTOK · MANUAL DISCOVERY</div><h1>Tiktok喜剧视频抓取平台</h1><p>近 30 天 · 100 万播放以上 · 夫妻 / 情侣剧情喜剧 · 英语和葡语</p></div><div id="last-run" class="last-run">还没有进行关键词抓取</div></section>
    <div class="bar"><div class="tabs" role="tablist" aria-label="筛选状态"><button class="tab active" data-view="pending" role="tab">待筛选 <span id="count-pending">0</span></button><button class="tab" data-view="selected" role="tab">已选择 <span id="count-selected">0</span></button><button class="tab" data-view="rejected" role="tab">已跳过 <span id="count-rejected">0</span></button></div><div id="queue-copy" class="queue-copy">正在读取候选视频…</div></div>
    <section id="grid" class="grid"><div class="empty"><strong>正在载入</strong>请稍候。</div></section>
  </main>
  <div id="login" class="login"><form id="login-form" class="login-box"><img class="login-logo" src="/brand/kwai-wordmark.svg" alt="Kwai"><h2>登录选片工作台</h2><p>使用 Creator 运营后台密码。</p><input id="password" type="password" placeholder="运营后台密码" required><div id="login-error" class="login-error"></div><button class="fetch" type="submit">进入工作台</button></form></div>
  <div id="toast" class="toast"></div>
  <script>
    const app={data:null,view:'pending',poll:null,playerObserver:null,players:new Map()};
    const MAX_PLAYERS=4;
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const fmt=n=>{n=Number(n||0);if(n>=1e8)return(n/1e8).toFixed(n>=1e9?0:1)+'亿';if(n>=1e4)return(n/1e4).toFixed(n>=1e6?0:1)+'万';return String(n)};
    const date=v=>{const d=new Date(v||0);return isNaN(d)?'时间未知':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric'}).format(d)};
    const toast=m=>{const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2600)};
    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(response.status===401){$('#login').classList.add('show');throw new Error('AUTH')}const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data}
    function setFetching(active){const button=$('#fetch');button.disabled=active;button.innerHTML=active?'<span class="loading"></span>正在抓取':'抓取今日视频'}
    async function load(){try{app.data=await api('/api/content-radar');render();setFetching(!!app.data.refreshing);if(!app.data.refreshing&&app.poll){clearInterval(app.poll);app.poll=null}}catch(error){if(error.message!=='AUTH')toast(error.message)}}
    function render(){const data=app.data||{},posts=data.posts||[],counts=data.counts||{};$('#count-pending').textContent=counts.pending||0;$('#count-selected').textContent=counts.selected||0;$('#count-rejected').textContent=counts.rejected||0;document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===app.view));const rows=posts.filter(post=>(post.decision||'pending')===app.view);const labels={pending:'待筛选',selected:'已选择',rejected:'已跳过'};$('#queue-copy').innerHTML=`<b>${labels[app.view]}</b> · ${rows.length} 条`;const run=data.last_run;if(run){const when=new Date(run.finished_at||run.started_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});$('#last-run').innerHTML=run.status==='success'?`上次抓取 <b>${esc(when)}</b><br>新增 ${run.new_posts||0} 条，重复内容自动更新、不重复入队`:`上次抓取失败：${esc(run.error||'未知错误')}`}else{$('#last-run').textContent='还没有进行关键词抓取'};renderCards(rows)}
    function placeholder(post){return `<div class="player-placeholder"><div><span class="play">▶</span><b>@${esc(post.creator_username)}</b><span>正在载入站内预览…</span></div></div>`}
    function card(post){const metrics=post.metrics||{},caption=post.caption||'无标题，可直接在上方播放查看内容';return `<article class="card" data-card="${esc(post.id)}"><div class="player-shell" data-player-id="${esc(post.post_id)}" data-username="${esc(post.creator_username)}" aria-label="@${esc(post.creator_username)} 的 TikTok 视频播放器">${placeholder(post)}<span class="views">▶ ${fmt(metrics.views)} 播放</span></div><div class="body"><div class="meta"><span class="author">@${esc(post.creator_username)}</span><span>${date(post.published_at)}</span></div><div class="caption" title="${esc(caption)}">${esc(caption)}</div><div class="actions"><button class="choice no" data-id="${esc(post.id)}" data-decision="rejected">不要</button><button class="choice yes" data-id="${esc(post.id)}" data-decision="selected">要</button></div></div></article>`}
    function stopPlayer(shell){const id=shell.dataset.playerId,frame=shell.querySelector('iframe');if(frame)frame.src='about:blank';shell.querySelector('iframe')?.remove();if(!shell.querySelector('.player-placeholder'))shell.insertAdjacentHTML('afterbegin',placeholder({creator_username:shell.dataset.username}));app.players.delete(id)}
    function stopAllPlayers(){app.playerObserver?.disconnect();app.playerObserver=null;app.players.forEach(stopPlayer);app.players.clear()}
    function startPlayer(shell){const id=shell.dataset.playerId;if(!id||app.players.has(id))return;while(app.players.size>=MAX_PLAYERS){const oldest=app.players.values().next().value;if(!oldest)break;stopPlayer(oldest)}const frame=document.createElement('iframe');frame.src=`https://www.tiktok.com/player/v1/${encodeURIComponent(id)}?autoplay=0&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=1&description=0&music_info=0&rel=0`;frame.loading='lazy';frame.allow='fullscreen; autoplay; encrypted-media; picture-in-picture';frame.referrerPolicy='strict-origin-when-cross-origin';frame.title=`@${shell.dataset.username} 的 TikTok 视频`;shell.querySelector('.player-placeholder')?.remove();shell.prepend(frame);app.players.set(id,shell)}
    function observePlayers(){app.playerObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.intersectionRatio>=.5)startPlayer(entry.target);else if(app.players.has(entry.target.dataset.playerId))stopPlayer(entry.target)}),{threshold:[0,.5]});document.querySelectorAll('.player-shell').forEach(shell=>app.playerObserver.observe(shell))}
    function renderCards(rows){stopAllPlayers();const grid=$('#grid');if(rows.length){grid.innerHTML=rows.map(card).join('');requestAnimationFrame(observePlayers);return}const message=app.view==='pending'?['这一轮已经看完了','点击右上角抓取更多 TikTok 视频。']:app.view==='selected'?['还没有选择视频','回到“待筛选”，看完视频后点击“要”。']:['还没有跳过的视频','不合适的内容会保存在这里，避免重复判断。'];grid.innerHTML=`<div class="empty"><strong>${message[0]}</strong>${message[1]}${app.view==='pending'?'<br><button class="fetch" data-fetch>抓取今日视频</button>':''}</div>`}
    async function decide(button){const post=app.data.posts.find(item=>item.id===button.dataset.id);if(!post)return;const previous=post.decision||'pending';post.decision=button.dataset.decision;render();try{await api('/api/content-radar/decision',{method:'POST',body:JSON.stringify({post_id:post.id,decision:post.decision})});await load()}catch(error){post.decision=previous;render();toast(error.message)}}
    async function fetchVideos(){setFetching(true);try{const result=await api('/api/content-radar/refresh',{method:'POST',body:'{}'});toast(result.message||'已开始抓取');if(!app.poll)app.poll=setInterval(load,3000);setTimeout(load,800)}catch(error){setFetching(false);toast(error.message)}}
    document.addEventListener('click',event=>{const tab=event.target.closest('[data-view]');if(tab){app.view=tab.dataset.view;render();return}const choice=event.target.closest('[data-decision]');if(choice){decide(choice);return}if(event.target.closest('[data-fetch]'))fetchVideos()});
    $('#login-form').addEventListener('submit',async event=>{event.preventDefault();$('#login-error').textContent='';try{const response=await fetch('/koko_admin_2026-kwai/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'登录失败');$('#login').classList.remove('show');$('#password').value='';load()}catch(error){$('#login-error').textContent=error.message}});
    $('#fetch').addEventListener('click',fetchVideos);
    load();setInterval(()=>{if(app.data?.refreshing)load()},5000);
  </script>
</body>
</html>
